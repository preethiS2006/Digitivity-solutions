version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=your_highly_secret_and_extremely_complicated_security_key_12345
      - PORT=3000
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: always
